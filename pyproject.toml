[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-swap-video"
version = "0.1.0"
description = "Authorized video face detection and face swap toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["opencv-python>=4.9", "numpy>=1.26"]

[project.scripts]
face-swap-video = "face_swap_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
